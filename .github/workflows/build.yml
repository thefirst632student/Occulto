name: Build Release x64 VS2022 Self-contained

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master

jobs:
  build-release-x64-vs2022:
    name: Build MetadataParser.exe and GameAssembly.dll with VS2022
    runs-on: windows-2022

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup VS2022 MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: '[17.0,18.0)'
          msbuild-architecture: x64

      - name: Verify Visual Studio 2022 toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $vsWhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vsPath = & $vsWhere `
            -version '[17.0,18.0)' `
            -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath

          if (-not $vsPath) {
            throw 'Visual Studio 2022 with VC++ x64 tools was not found.'
          }

          Write-Host "Visual Studio 2022 path: ${vsPath}"
          msbuild -version

      - name: Patch Release x64 projects for static MSVC runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -c @'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          projects = [
              Path("MetadataParser/MetadataParser/MetadataParser.vcxproj"),
              Path("Middleware/Middleware/Middleware.vcxproj"),
          ]

          release_x64_condition = "'$(Configuration)|$(Platform)'=='Release|x64'"

          for project_path in projects:
              if not project_path.exists():
                  raise FileNotFoundError(f"Project file not found: {project_path}")

              tree = ET.parse(project_path)
              root = tree.getroot()

              if root.tag.startswith("{"):
                  namespace = root.tag.split("}", 1)[0][1:]
                  ET.register_namespace("", namespace)
                  def tag(name: str) -> str:
                      return f"{{{namespace}}}{name}"
              else:
                  def tag(name: str) -> str:
                      return name

              item_definition_group = None
              for node in root.findall(tag("ItemDefinitionGroup")):
                  if node.attrib.get("Condition") == release_x64_condition:
                      item_definition_group = node
                      break

              if item_definition_group is None:
                  raise RuntimeError(
                      f"Release|x64 ItemDefinitionGroup was not found in {project_path}"
                  )

              cl_compile = item_definition_group.find(tag("ClCompile"))
              if cl_compile is None:
                  cl_compile = ET.SubElement(item_definition_group, tag("ClCompile"))

              runtime_library = cl_compile.find(tag("RuntimeLibrary"))
              if runtime_library is None:
                  runtime_library = ET.SubElement(cl_compile, tag("RuntimeLibrary"))

              runtime_library.text = "MultiThreaded"
              tree.write(project_path, encoding="utf-8", xml_declaration=True)
              print(f"Patched {project_path}: RuntimeLibrary=MultiThreaded (/MT) for Release|x64")
          '@

      - name: Show patched runtime settings
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Select-String `
            -Path .\MetadataParser\MetadataParser\MetadataParser.vcxproj,.\Middleware\Middleware\Middleware.vcxproj `
            -Pattern '<RuntimeLibrary>|MultiThreaded' `
            -Context 2,2

      - name: Build MetadataParser Release x64 with VS2022
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          msbuild .\MetadataParser\MetadataParser.sln `
            /m `
            /restore `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:PlatformToolset=v143 `
            /p:PreferredToolArchitecture=x64 `
            /p:UseDebugLibraries=false `
            /p:WindowsTargetPlatformVersion=10.0

      - name: Build GameAssembly Release x64 with VS2022
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          msbuild .\Middleware\Middleware.sln `
            /m `
            /restore `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:PlatformToolset=v143 `
            /p:PreferredToolArchitecture=x64 `
            /p:UseDebugLibraries=false `
            /p:WindowsTargetPlatformVersion=10.0

      - name: Collect binary artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          New-Item -ItemType Directory -Force -Path artifacts | Out-Null

          $metadataParser = Get-ChildItem -Path .\MetadataParser -Recurse -File -Filter MetadataParser.exe |
            Where-Object { $_.FullName -like '*\x64\Release\*' } |
            Sort-Object FullName |
            Select-Object -First 1

          $gameAssembly = Get-ChildItem -Path .\Middleware -Recurse -File -Filter GameAssembly.dll |
            Where-Object { $_.FullName -like '*\x64\Release\*' } |
            Sort-Object FullName |
            Select-Object -First 1

          if (-not $metadataParser) {
            throw 'MetadataParser.exe was not found under MetadataParser/**/x64/Release/** after build.'
          }

          if (-not $gameAssembly) {
            throw 'GameAssembly.dll was not found under Middleware/**/x64/Release/** after build.'
          }

          Copy-Item -LiteralPath $metadataParser.FullName -Destination .\artifacts\MetadataParser.exe -Force
          Copy-Item -LiteralPath $gameAssembly.FullName -Destination .\artifacts\GameAssembly.dll -Force

          Get-ChildItem .\artifacts | Format-Table Name, Length, FullName

      - name: Verify x64 and self-contained CRT dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $vsWhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vsPath = & $vsWhere `
            -version '[17.0,18.0)' `
            -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath

          if (-not $vsPath) {
            throw 'Visual Studio 2022 installation with VC x64 tools was not found.'
          }

          $dumpbin = Get-ChildItem -Path (Join-Path $vsPath 'VC\Tools\MSVC') -Recurse -Filter dumpbin.exe |
            Where-Object { $_.FullName -match '\\bin\\Hostx64\\x64\\dumpbin\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1

          if (-not $dumpbin) {
            throw 'dumpbin.exe was not found.'
          }

          $binaries = @(
            '.\artifacts\MetadataParser.exe',
            '.\artifacts\GameAssembly.dll'
          )

          $forbiddenRuntimeDlls = '(?i)\b(VCRUNTIME|MSVCP|CONCRT|ucrtbase)\S*\.dll\b'

          foreach ($binary in $binaries) {
            if (-not (Test-Path -LiteralPath $binary)) {
              throw "Missing binary: ${binary}"
            }

            $headers = & $dumpbin.FullName /HEADERS $binary | Out-String
            if ($headers -notmatch 'machine \(x64\)') {
              Write-Host $headers
              throw "${binary} is not an x64 binary."
            }

            $dependents = & $dumpbin.FullName /DEPENDENTS $binary | Out-String
            Write-Host "Dependencies for ${binary}:"
            Write-Host $dependents

            if ($dependents -match $forbiddenRuntimeDlls) {
              throw "${binary} imports MSVC/UCRT runtime DLLs. Static CRT (/MT) self-contained check failed."
            }
          }

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: Occulto-Release-x64-VS2022-self-contained
          path: |
            artifacts/MetadataParser.exe
            artifacts/GameAssembly.dll
          if-no-files-found: error
